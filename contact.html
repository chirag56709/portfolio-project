<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Chirag</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }
    .fade-in.show {
      opacity: 1;
      transform: translateY(0);
    }
    input:hover, textarea:hover {
      border-color: #10B981;
    }
  </style>
</head>

<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col">

  
  <nav class="bg-gray-800 shadow-md sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-5 py-4 flex justify-between items-center">

    
      <a href="index.html" class="flex items-center gap-3 text-green-400 font-bold text-2xl">
        <img src="images/logo.jpg" class="w-8 h-8 rounded-full object-cover">
        <span>Chirag</span>
      </a>

     
      <button id="menu-btn" class="text-white text-3xl md:hidden focus:outline-none">
        ☰
      </button>

      
      <ul id="menu" class="hidden md:flex gap-6 text-gray-300">
        <li><a href="index.html" class="hover:text-white">Home</a></li>
        <li><a href="about.html" class="hover:text-white">About</a></li>
        <li><a href="projects.html" class="hover:text-white">Projects</a></li>
        <li><a href="resume.html" class="hover:text-white">Resume</a></li>
        <li><a href="contact.html" class="text-white font-semibold">Contact</a></li>
      </ul>
    </div>

    <!-- Mobile Navigation -->
    <ul id="mobile-menu" class="md:hidden hidden flex-col bg-gray-700 text-gray-300 px-6 py-4 space-y-3">
      <li><a href="index.html" class="block py-2 hover:text-white">Home</a></li>
      <li><a href="about.html" class="block py-2 hover:text-white">About</a></li>
      <li><a href="projects.html" class="block py-2 hover:text-white">Projects</a></li>
      <li><a href="resume.html" class="block py-2 hover:text-white">Resume</a></li>
      <li><a href="contact.html" class="block py-2 hover:text-white font-semibold text-green-400">Contact</a></li>
    </ul>
  </nav>

  <!--Contact Section -->
  <main class="flex-grow flex items-center justify-center px-4 py-12 max-w-3xl mx-auto w-full">
    <section class="bg-gray-800 rounded-2xl shadow-lg p-8 w-full fade-in border border-gray-700">
      <h1 class="text-4xl font-bold text-green-400 mb-6 text-center">Get in Touch</h1>

      <!-- Success Message -->
      <p id="formMessage" class="hidden text-center text-green-400 mb-4 font-semibold"></p>

      <form id="contactForm" action="contact_process.php" method="POST" class="space-y-6">

        <div>
          <label class="block mb-2 font-semibold text-gray-200 flex items-center gap-2">
            <i data-feather="user"></i> Name
          </label>
          <input type="text" name="name" required
            class="w-full px-4 py-3 rounded-md bg-gray-700 border border-gray-600 placeholder-gray-400 text-white focus:ring-2 focus:ring-green-400">
        </div>

        <div>
          <label class="block mb-2 font-semibold text-gray-200 flex items-center gap-2">
            <i data-feather="mail"></i> Email
          </label>
          <input type="email" name="email" required
            class="w-full px-4 py-3 rounded-md bg-gray-700 border border-gray-600 placeholder-gray-400 text-white focus:ring-2 focus:ring-green-400">
        </div>

        <div>
          <label class="block mb-2 font-semibold text-gray-200 flex items-center gap-2">
            <i data-feather="message-circle"></i> Message
          </label>
          <textarea name="message" rows="5" required
            class="w-full px-4 py-3 rounded-md bg-gray-700 border border-gray-600 placeholder-gray-400 text-white resize-none focus:ring-2 focus:ring-green-400"></textarea>
        </div>

        <button type="submit"
          class="w-full bg-green-500 hover:bg-green-600 transition font-bold py-3 rounded-md text-white text-lg shadow-md flex items-center justify-center gap-2">
          <i data-feather="send"></i> Send Message
        </button>

      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-800 text-center py-4 text-gray-400 border-t border-gray-700">
    &copy; 2025 Chirag | Web Developer
  </footer>

  <script>
    feather.replace();

    const menuBtn = document.getElementById("menu-btn");
    const mobileMenu = document.getElementById("mobile-menu");

    menuBtn.addEventListener("click", () => {
      mobileMenu.classList.toggle("hidden");
    });

    // Fade-in
    const fadeElements = document.querySelectorAll('.fade-in');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('show');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });
    fadeElements.forEach(el => observer.observe(el));

    // Form Message
    const form = document.getElementById("contactForm");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      document.getElementById("formMessage").textContent = "✅ Message sent successfully!";
      document.getElementById("formMessage").classList.remove("hidden");
      form.reset();
    });
  </script>
</body>
</html>
